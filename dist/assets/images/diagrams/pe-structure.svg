<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="Consolas, 'Courier New', monospace" font-size="14">
  <rect x="0" y="0" width="700" height="480" fill="#ffffff" stroke="#d0d0d0"/>
  <text x="20" y="28" font-size="17" font-weight="bold" fill="#111">PE(Portable Executable) 파일 구조 개요</text>

  <g stroke="#888">
    <rect x="60" y="45"  width="580" height="40" fill="#eef3ff"/>
    <rect x="60" y="85"  width="580" height="40" fill="#e6f0ff"/>
    <rect x="60" y="125" width="580" height="40" fill="#e0ecff"/>
    <rect x="60" y="165" width="580" height="40" fill="#dbe8ff"/>
    <rect x="60" y="205" width="580" height="34" fill="#fff3e6"/>
    <rect x="60" y="239" width="580" height="34" fill="#ffe9d1"/>
    <rect x="60" y="273" width="580" height="34" fill="#ffe0bb"/>
    <rect x="60" y="307" width="580" height="34" fill="#ffe0bb"/>
    <rect x="60" y="341" width="580" height="34" fill="#ffe0bb"/>
    <rect x="60" y="375" width="580" height="34" fill="#ffe0bb"/>
  </g>
  <g font-size="14" fill="#111">
    <text x="75" y="70">DOS Header (MZ 시그니처, e_lfanew: PE 헤더 오프셋)</text>
    <text x="75" y="110">DOS Stub ("This program cannot be run in DOS mode")</text>
    <text x="75" y="150">PE Header (PE 시그니처 + COFF File Header: 머신, 섹션 수, 타임스탬프)</text>
    <text x="75" y="190">Optional Header (EntryPoint, ImageBase, Data Directories: Import/Export/Reloc 등)</text>
    <text x="75" y="227">Section Table (각 섹션의 이름/RVA/크기/파일 오프셋/플래그)</text>
    <text x="75" y="261">.text 섹션 (실행 코드)</text>
    <text x="75" y="295">.rdata 섹션 (Import Table, 문자열 등 읽기 전용 데이터)</text>
    <text x="75" y="329">.data 섹션 (전역 변수 등 읽기/쓰기 데이터)</text>
    <text x="75" y="363">.rsrc 섹션 (아이콘/버전정보/매니페스트 등 리소스)</text>
    <text x="75" y="397">.reloc 섹션 (베이스 재배치 정보, ASLR용)</text>
  </g>
  <text x="20" y="425" font-size="12" fill="#555">RVA(Relative Virtual Address) = ImageBase 기준 오프셋. 파일 오프셋과 RVA는 섹션마다 다르게 매핑된다.</text>
  <text x="20" y="447" font-size="12" fill="#555">IDA/Ghidra/PE-bear는 이 구조를 자동으로 파싱해 Segments/Sections 창에 보여준다 (REV-0114~0117 참고).</text>
</svg>
